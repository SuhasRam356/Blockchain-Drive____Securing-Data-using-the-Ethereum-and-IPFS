specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: UploadUpgradeableV7
    network: sepolia
    source:
      address: "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512" # Proxy address
      abi: UploadUpgradeableV7
      startBlock: 3
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - File
        - Access
        - UserMetric
        - ActivityEvent
      abis:
        - name: UploadUpgradeableV7
          file: ./abis/UploadUpgradeableV7.json
      eventHandlers:
        - event: FileAdded(indexed address,indexed address,string,string)
          handler: handleFileAdded
        - event: FileDeleted(indexed address,string)
          handler: handleFileDeleted
        - event: FileUpdated(indexed address,string,string)
          handler: handleFileUpdated
        - event: AccessGranted(indexed address,indexed address,uint256)
          handler: handleAccessGranted
        - event: AccessRevoked(indexed address,indexed address)
          handler: handleAccessRevoked
        - event: PublicKeyPublished(indexed address,string)
          handler: handlePublicKeyPublished
      file: ./src/mapping.ts
